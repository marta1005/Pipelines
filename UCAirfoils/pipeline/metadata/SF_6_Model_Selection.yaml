Model_Selection:
  inputs:
    - alpha
    - log10_Re
    - uW1
    - uW2
    - uW3
    - uW4
    - uW5
    - uW6
    - uW7
    - uW8
    - lW1
    - lW2
    - lW3
    - lW4
    - lW5
    - lW6
    - lW7
    - lW8
    - TE_thickness
    - LE_weight
  outputs:
    - CL
    - CD
    - CM
    - Top_Xtr
    - Bot_Xtr
  algorithms:
    # ── RECOMMENDED: MLP ─────────────────────────────────────────────────────
    # All 20 inputs are continuous (alpha, log10_Re, 16 Kulfan CST weights,
    # TE thickness, LE weight) and the 5 outputs vary smoothly over the design
    # space — a deep MLP suits this better than trees, which have no discrete
    # splits to exploit here.
    - name: LogTargetMLPRegressor
      label: MLP
      settings:
        # CD is strictly positive and spans about a decade, so it is fitted
        # in log space and exponentiated back on predict. Everything
        # downstream still sees CD in physical units.
        log_targets: [CD]
        # 20 inputs -> 256 -> 128 -> 64 -> 5 outputs. Wider than the previous
        # 128/64/32: the DoE now yields ~120k usable points after the
        # confidence filter, and there are 5 targets instead of 3.
        hidden_layer_sizes: [256, 128, 64]
        activation: relu
        solver: adam
        alpha: 0.0001
        batch_size: 512
        learning_rate: adaptive
        learning_rate_init: 0.001
        max_iter: 500
        early_stopping: true
        validation_fraction: 0.10
        n_iter_no_change: 20
        tol: 0.000001
        random_state: 42
        verbose: true
