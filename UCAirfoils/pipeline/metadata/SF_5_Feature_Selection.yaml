Feature_Selection:
  Add_Remove_Features:
    # 20 model inputs. Deliberately excluded from the 22 design-space entries:
    #   mach      fixed at 0.3, so it carries no information (zero variance)
    #   alpha_rad an exact linear function of alpha — redundant
    #   reynolds  replaced by log10_Re (see SF_2 metadata)
    inputs:
      - alpha
      - log10_Re
      - uW1
      - uW2
      - uW3
      - uW4
      - uW5
      - uW6
      - uW7
      - uW8
      - lW1
      - lW2
      - lW3
      - lW4
      - lW5
      - lW6
      - lW7
      - lW8
      - TE_thickness
      - LE_weight
    outputs:
      - CL
      - CD
      - CM
      - Top_Xtr
      - Bot_Xtr
  Preprocess:
    inputs:
      - alpha
      - log10_Re
      - uW1
      - uW2
      - uW3
      - uW4
      - uW5
      - uW6
      - uW7
      - uW8
      - lW1
      - lW2
      - lW3
      - lW4
      - lW5
      - lW6
      - lW7
      - lW8
      - TE_thickness
      - LE_weight
    method: normalizer_transformer
    # Every input is continuous — MinMax scaling applied uniformly.
    numerical_features: "[alpha, log10_Re, uW1, uW2, uW3, uW4, uW5, uW6, uW7, uW8, lW1, lW2, lW3, lW4, lW5, lW6, lW7, lW8, TE_thickness, LE_weight]"
