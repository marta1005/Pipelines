Data_Acquisition_Generation:
  Data_Generation:
    Create_Design_of_Experiments:

      Design_Space:
        inputs:
          # ── Flow conditions ────────────────────────────────────────────────
          - family: fluid_mechanics
            name: alpha
            description: angle of attack (deg)
            bounds: [-12.0, 12.0]

          - family: fluid_mechanics
            name: reynolds
            description: Reynolds number
            bounds: [1.0e5, 1.0e8]
            # Spans three decades, so it is sampled logarithmically: a linear
            # Sobol draw puts ~99 % of the points above 1e6 and starves the low
            # end, and CD varies with log(Re). Set scale: linear to sample the
            # interval uniformly instead.
            scale: log

          - family: fluid_mechanics
            name: alpha_rad
            description: angle of attack as radiant
            equation: alpha * 3.1415926545 / 180

          - family: fluid_mechanics
            name: log10_Re
            description: >
              log10 of the Reynolds number. This, not the raw value, is what the
              surrogate is trained on: Re spans three decades, so after MinMax
              scaling the raw column would crush almost every point into the
              bottom of the range. NeuralFoil itself works in log(Re).
            equation: log10(reynolds)

          - family: mechanics
            name: mach
            description: Mach number
            value: 0.3

          # ── Kulfan CST — upper surface weights ─────────────────────────────
          - {name: uW1, bounds: [0.1, 0.36]}
          - {name: uW2, bounds: [0.1, 0.36]}
          - {name: uW3, bounds: [0.1, 0.36]}
          - {name: uW4, bounds: [0.1, 0.36]}
          - {name: uW5, bounds: [0.1, 0.36]}
          - {name: uW6, bounds: [0.1, 0.36]}
          - {name: uW7, bounds: [0.1, 0.36]}
          - {name: uW8, bounds: [0.1, 0.36]}

          # ── Kulfan CST — lower surface weights ─────────────────────────────
          - {name: lW1, bounds: [-0.34, 0.13]}
          - {name: lW2, bounds: [-0.34, 0.13]}
          - {name: lW3, bounds: [-0.34, 0.13]}
          - {name: lW4, bounds: [-0.34, 0.13]}
          - {name: lW5, bounds: [-0.34, 0.13]}
          - {name: lW6, bounds: [-0.34, 0.13]}
          - {name: lW7, bounds: [-0.34, 0.13]}
          - {name: lW8, bounds: [-0.34, 0.13]}

          # ── Geometry ───────────────────────────────────────────────────────
          - {name: TE_thickness, bounds: [0.0015, 0.0051]}
          - {name: LE_weight,    bounds: [-1.8e-2, 2.3e-1]}

        constraints:
          - "-0.2 < alpha_rad"
          - "alpha_rad < 0.2"

      DoE:
        tool: "python library: Sobol"
        algorithm: Sobol
        size: 200000
        margin_on_bounds: 0

  Data_Acquisition:
    Extract:
      # Data is generated by the DoE above and evaluated with NeuralFoil, so
      # there is no external file to read.
      method: generated
