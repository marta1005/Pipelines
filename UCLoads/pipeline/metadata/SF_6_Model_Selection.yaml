Model_Selection:
  inputs:
    - "Mach"
    - "Altitude_ft"
    - "ALPHA_deg"
  outputs:
    - "Fz_WINGROOT"
    - "Mx_WINGROOT"
    - "My_WINGROOT"
    - "Fy_FUS"
    - "Fz_FUS"
    - "Mx_FUS"
    - "My_FUS"
    - "Mz_FUS"
  algorithms:
    - name: MLPRegressor
      label: MLP
      settings:
        # 3 inputs → 64 → 32 → 8 outputs  (α=0.01 L2 reg)
        hidden_layer_sizes: [64, 32]
        activation: relu
        solver: adam
        alpha: 0.01
        batch_size: 32
        learning_rate: adaptive
        learning_rate_init: 0.001
        max_iter: 500
        early_stopping: true
        validation_fraction: 0.15
        n_iter_no_change: 20
        tol: 0.00001
        random_state: 42
        verbose: true

    - name: MultiOutputGradientBoosting
      label: GradientBoosting
      settings:
        n_estimators: 100
        max_depth: 4
        learning_rate: 0.1
        subsample: 0.8
        min_samples_leaf: 5
        random_state: 42
        verbose: 0
