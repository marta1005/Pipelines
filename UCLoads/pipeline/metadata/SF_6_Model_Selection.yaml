Model_Selection:
  inputs:
    - "Mach"
    - "Altitude_ft"
    - "ALPHA_deg"
  outputs:
    - "Fz_WINGROOT"
    - "Mx_WINGROOT"
    - "My_WINGROOT"
    - "Fy_FUS"
    - "Fz_FUS"
    - "Mx_FUS"
    - "My_FUS"
    - "Mz_FUS"
  algorithms:
    - name: MLPRegressor
      label: MLP
      settings:
        hidden_layer_sizes: [64, 32]
        activation: relu
        solver: adam
        alpha: 0.01
        batch_size: 32
        learning_rate: adaptive
        learning_rate_init: 0.001
        max_iter: 500
        early_stopping: true
        validation_fraction: 0.15
        n_iter_no_change: 20
        tol: 0.00001
        random_state: 42
        verbose: false

    - name: MultiOutputGradientBoosting
      label: GradientBoosting
      settings:
        n_estimators: 100
        max_depth: 4
        learning_rate: 0.1
        subsample: 0.8
        min_samples_leaf: 5
        random_state: 42
        verbose: 0

    - name: MultiOutputXGBoost
      label: XGBoost
      settings:
        n_estimators: 300
        max_depth: 5
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        min_child_weight: 5
        reg_alpha: 0.1
        reg_lambda: 1.0
        random_state: 42
        verbosity: 0
        nthread: 1

    - name: PyTorchNN
      label: PyTorchNN
      settings:
        n_hidden: 128
        n_layers: 4
        lr: 0.001
        epochs: 500
        batch_size: 64
        patience: 30
        weight_decay: 0.0001
        loss: mse
        random_state: 42
        verbose: true
