Data_Acquisition_Generation:
  Data_Acquisition:
    Extract:
      method: pre_split
      # Data is provided as pre-split CSV files in data_split_folder:
      #   x_train.csv  x_val.csv  x_test.csv   — input columns (x, y, z, alpha, mach)
      #   yt_train.csv yt_val.csv yt_test.csv  — true output column (Cp)
      # Optional (not used for training):
      #   yh_train.csv yh_val.csv yh_test.csv  — external model predictions
